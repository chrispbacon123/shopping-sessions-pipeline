[package]
name = "shopping_sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
memmap2 = "0.9"
memchr = "2"
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = "0.15"
parquet = { version = "53", default-features = false, features = ["arrow"] }
arrow-array = "53"
arrow-schema = "53"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
