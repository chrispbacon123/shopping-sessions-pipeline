[package]
name = "shopping_sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shopping_sessions"
path = "src/main.rs"

[[bin]]
name = "bandwidth_exp"
path = "src/bandwidth_exp.rs"

[[bin]]
name = "compare_parsers"
path = "src/compare_parsers.rs"

[[bin]]
name = "bench_ts"
path = "src/bench_ts.rs"

[dependencies]
memmap2 = "0.9"
memchr = "2"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = "0.15"
parquet = { version = "53", default-features = false, features = ["arrow"] }
arrow-array = "53"
arrow-schema = "53"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.quick]
debug = "line-tables-only"
inherits = "release"
lto = false
codegen-units = 16
